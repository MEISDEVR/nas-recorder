services:
  nas-recorder:
    build: .
    image: nas-recorder:latest
    container_name: nas-recorder
    restart: unless-stopped
    ports:
      - "8443:8443"   # HTTPS，录屏用这个
      - "8080:8080"   # HTTP，仅在前面挂了反向代理时才需要
    volumes:
      - ./recordings:/recordings   # 录像保存位置，改成你 NAS 上的共享文件夹
      - ./certs:/certs             # 自签证书
    environment:
      - TZ=Asia/Shanghai
      - PASSWORD=                  # 可选：设置后浏览器会弹登录框（用户名随意）
      - CERT_HOSTS=                # 可选：NAS 的局域网 IP / 域名，逗号分隔，如 192.168.1.10,nas.local
      - PUBLIC_HTTPS_PORT=8443     # 若上面把 8443 映射成别的端口，这里同步改
